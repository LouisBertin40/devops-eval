services:
  web:
    build: .
    image: ghcr.io/louisbertin40/devops-eval:${IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
