name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps/
      - name: Lint Python
        run: flake8 .
      - name: Lint YAML
        run: yamllint .

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: pytest -v --junitxml=reports/junit.xml --cov=app --cov-report=xml:reports/coverage.xml
      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-py${{ matrix.python-version }}
          path: reports/

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les rapports de tests
        uses: actions/download-artifact@v4
        with:
          pattern: rapports-*
          path: reports/
      - name: Afficher les rapports récupérés
        run: ls -R reports/
      - name: Build de l'image Docker
        run: docker build -t devops-eval:ci .

  ci-ok:
    needs: [lint, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vérifier que tous les jobs ont réussi
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "Tous les jobs sont verts"
