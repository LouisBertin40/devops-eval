name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement de déploiement
        type: choice
        options: [production]
        default: production

permissions:
  contents: read

jobs:
  build-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/louisbertin40/devops-eval
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Calculer le SHA court
        id: vars
        run: echo "short_sha=${SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.IMAGE }}:1.0.${{ github.run_number }}
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, deploy]
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROJECT_NAME: devops-eval-prod
      WEB_PORT: "8080"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mémoriser la version actuellement déployée
        id: previous
        run: |
          $id = docker compose ps -q web
          $tag = ""
          if ($id) { $tag = (docker inspect -f '{{.Config.Image}}' $id).Split(':')[-1] }
          Write-Host "Version actuelle : $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Télécharger la nouvelle image
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.short_sha }}
        run: docker compose pull web
      - name: Démarrer la nouvelle version
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.short_sha }}
        run: docker compose up -d --no-build
      - name: Vérification post-déploiement (3 retries)
        run: curl.exe -fsS --retry 3 --retry-delay 10 --retry-all-errors http://localhost:8080/health
      - name: Rollback vers la version précédente
        if: failure() && steps.previous.outputs.tag != ''
        env:
          IMAGE_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          Write-Host "Rollback vers $env:IMAGE_TAG"
          docker compose pull web
          docker compose up -d --no-build
